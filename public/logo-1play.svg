<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b" />
      <stop offset="50%" stop-color="#e01830" />
      <stop offset="100%" stop-color="#990014" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Red Jet Shield Badge for '1' -->
  <rect x="5" y="8" width="54" height="54" rx="14" fill="url(#redGrad)" filter="url(#glow)"/>
  <rect x="5" y="8" width="54" height="54" rx="14" fill="none" stroke="rgba(255,215,0,0.6)" stroke-width="1.5"/>

  <!-- Jet silhouette inside badge -->
  <path d="M42 35 L18 20 L24 35 L18 50 Z" fill="#ffffff" opacity="0.95"/>
  <circle cx="34" cy="35" r="3" fill="#ffd700" filter="url(#glow)"/>

  <!-- '1' Overlay -->
  <text x="26" y="47" font-family="'Rajdhani', sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" filter="url(#glow)">1</text>

  <!-- 'play' Typography -->
  <text x="68" y="48" font-family="'Inter', sans-serif" font-weight="900" font-size="36" fill="#ffffff" letter-spacing="-1">
    play
  </text>

  <!-- Gold Dot & Slogan -->
  <circle cx="146" cy="46" r="4" fill="url(#goldGrad)" filter="url(#glow)"/>
  <text x="69" y="62" font-family="'Rajdhani', sans-serif" font-weight="800" font-size="10" fill="#ffd700" letter-spacing="3" text-transform="uppercase">
    AVIATOR CASINO
  </text>
</svg>
